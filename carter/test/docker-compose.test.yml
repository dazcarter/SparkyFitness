# Throwaway test instance (project "tracker-test"), loopback-only on CT 107.
# Reach it from a workstation with:  ssh -L 18080:127.0.0.1:18080 <ct107>  ->  http://localhost:18080
# Run from /opt/tracker:  docker compose -p tracker-test -f docker-compose.yml -f test/docker-compose.test.yml up -d
# Remove completely:      docker compose -p tracker-test ... down -v && rm -rf /opt/tracker/test-data
services:
  sparkyfitness-db:
    container_name: sparkyfitness-test-db
    volumes: !override
      - ./test-data/postgresql:/var/lib/postgresql
  sparkyfitness-server:
    environment:
      SPARKY_FITNESS_FRONTEND_URL: http://localhost:18080
      SPARKY_FITNESS_LOG_LEVEL: INFO
    volumes: !override
      - ./test-data/backup:/app/SparkyFitnessServer/backup
      - ./test-data/uploads:/app/SparkyFitnessServer/uploads
  sparkyfitness-frontend:
    environment:
      SPARKY_FITNESS_FRONTEND_URL: http://localhost:18080
  familymeal-bridge:
    volumes: !override
      - ./test-data/bridge:/data
  proxy:
    ports: !override
      - "127.0.0.1:18080:8080"
    volumes: !override
      - ./test/nginx-test.conf:/etc/nginx/conf.d/default.conf:ro

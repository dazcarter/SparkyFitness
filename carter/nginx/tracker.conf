server {
  listen 80;
  server_name _;
  return 301 https://tracker.carterhome.com.au$request_uri;
}

# Requests arriving through the Cloudflare tunnel (cloudflared-ha in CT 103, 192.168.0.50) may only reach the
# Claude MCP connector and the pages its OAuth sign-in needs. Everything else from the tunnel gets 404.
geo $from_tunnel { default 0; 192.168.0.50 1; }
map "$from_tunnel:$uri" $tunnel_blocked {
  default 0;
  "~^1:/(mcp|\.well-known/|api/auth/|api/identity/|login|oauth/consent|assets/|locales/|images/|icons/|favicon|manifest|sw\.js|workbox-|registerSW)" 0;
  "~^1:" 1;
}

server {
  listen 443 ssl;
  http2 on;
  server_name tracker.carterhome.com.au;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/private.key;
  client_max_body_size 50m;
  if ($tunnel_blocked) { return 404; }

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;

  # Household add-on: FamilyMeal recipe import UI + API, and HA sensor endpoint.
  # Resolved per request so nginx still starts if the bridge is down.
  resolver 127.0.0.11 valid=30s;
  # Provider-emulation endpoints are for the SparkyFitness server on the compose network only.
  location ~ ^/familymeal/(ausnut|mealie)/ { return 404; }
  location /familymeal/ {
    set $bridge familymeal-bridge:8080;
    proxy_pass http://$bridge;
  }

  # SparkyFitness's service worker answers every page navigation with its own app (-> "Page not found" for
  # /familymeal/). Add /familymeal to its denylist; the worker uses skipWaiting, so phones update on next visit.
  location = /sw.js {
    proxy_pass http://sparkyfitness-frontend:80;
    proxy_set_header Accept-Encoding "";
    sub_filter_types application/javascript;
    sub_filter 'denylist:[/^\/api/' 'denylist:[/^\/familymeal/,/^\/api/';
    add_header Cache-Control "no-cache";
  }
  location / {
    proxy_pass http://sparkyfitness-frontend:80;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_read_timeout 300s;
    # Hide upstream's Star / Sponsor / Docs / Translate badges (header + footer) without rebuilding the image.
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter '</head>' '<style>a[href*="github.com/CodeWithCJ"],a[href*="github.com/sponsors/"],a[href*="codewithcj.github.io"],a[href*="weblate.sparkyfitness.com"]{display:none!important}</style></head>';
  }
}
